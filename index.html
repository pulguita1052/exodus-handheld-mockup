<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exodus Handheld · Prototipo</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgb(240,240,240);
    font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    box-sizing: border-box;
    padding: 40px 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    padding: 32px 28px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: rgb(52,52,52);
    margin: 0 0 6px;
  }
  p.sub {
    font-size: 14px;
    color: rgb(140,140,140);
    margin: 0 0 24px;
  }
  a.screen {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    padding: 16px 18px;
    border-radius: 12px;
    background: rgb(245,246,250);
    color: rgb(52,52,52);
    font-weight: 500;
    font-size: 16px;
    margin-bottom: 12px;
    transition: background 0.15s ease;
  }
  a.screen:hover { background: rgb(235,238,248); }
  a.screen span.desc {
    display: block;
    font-weight: 400;
    font-size: 12.5px;
    color: rgb(150,150,150);
    margin-top: 3px;
  }
  a.screen svg { color: rgb(195,195,195); flex-shrink: 0; }
</style>
</head>
<body>
<div class="card">
  <h1>Exodus Handheld</h1>
  <p class="sub">Prototipo de menú y configuraciones</p>

  <a class="screen" href="Menu%20Principal.dc.html">
    <div>Menú principal<span class="desc">Tareas, descargas y evidencias de envíos</span></div>
    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <a class="screen" href="Submenu%20Configuraciones.dc.html">
    <div>Configuraciones<span class="desc">Perfil e impresoras / sonidos</span></div>
    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <a class="screen" href="Configuracion%20de%20Impresoras.dc.html">
    <div>Impresoras<span class="desc">Agregar, eliminar y configurar uso</span></div>

  </a>

  <a class="screen" href="Sonidos.dc.html">
    <div>Sonidos<span class="desc">Lectura de elementos y alertas por tarea</span></div>
    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</div>

</html>
